ci:
  skip: [ty]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: debug-statements
  - id: forbid-submodules
  - id: requirements-txt-fixer
  - id: trailing-whitespace

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
  - id: codespell
    additional_dependencies:
      - tomli

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.10
  hooks:
  - id: ruff-check
    args: [ --fix ]
  - id: ruff-format

# See: https://docs.astral.sh/ty/reference/typing-faq/#is-there-a-pre-commit-hook-for-ty
- repo: local
  hooks:
  - id: ty
    name: ty check
    entry: ty check .
    language: python
